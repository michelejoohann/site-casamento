name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy ativo simultâneo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Recria o arquivo config.js dinamicamente usando os Secrets configurados no GitHub
      - name: Criar config.js a partir dos Secrets
        run: |
          echo "const CONFIG = {" > config.js
          echo "  GOOGLE_SHEET_URL: '${{ secrets.GOOGLE_SHEET_URL }}'," >> config.js
          echo "  ADMIN_PASSWORD: '${{ secrets.ADMIN_PASSWORD }}'" >> config.js
          echo "};" >> config.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
